<!doctype html><meta name="robots" content="noindex"><script>
addEventListener('message', async e => {
  if (!e.data || e.data.op !== 'get') return;
  try {
    const b = await fetch(e.data.url, {cache:'no-store'}).then(r => { if(!r.ok) throw r.status; return r.blob(); });
    e.source.postMessage({op:'blob', blob:b}, e.origin);
  } catch (err) { e.source.postMessage({op:'err', err:String(err)}, e.origin); }
});
(opener||parent).postMessage({op:'ready'}, '*');
</script>
